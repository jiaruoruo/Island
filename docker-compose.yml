services:
  db:
    image: pgvector/pgvector:pg16
    container_name: twoo-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: twoo
      POSTGRES_PASSWORD: twoo
      POSTGRES_DB: twoo
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twoo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
